title: "apm stack"
description: "Creates apm with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "OCID of the compartment"
    required: true
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  apm_domain_ids:
    type: csv
    title: "APM domain IDs"
  data_upload_endpoints:
    type: string
    title: "Data upload endpoints for APM agents"
