title: "object storage stack"
description: "Creates object-storage with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "OCID of the compartment"
    required: true
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region"
    required: false
    default: "ap-seoul-1"
outputs:
  bucket_names:
    type: string
    title: "Bucket names"
  bucket_uris:
    type: string
    title: "Bucket URIs"
