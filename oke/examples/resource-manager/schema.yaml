title: "oke stack"
description: "Creates oke with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
  - title: "Parameters"
    variables:
      - name
      - kubernetes_version
      - vcn_id
      - endpoint_subnet_id
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "Compartment OCID for the cluster."
    required: true
  name:
    type: string
    title: "name"
    description: "Cluster name."
    required: false
    default: "oke-basic"
  kubernetes_version:
    type: string
    title: "kubernetes version"
    description: "Kubernetes version supported in the region."
    required: true
  vcn_id:
    type: string
    title: "vcn id"
    description: "VCN OCID."
    required: true
  endpoint_subnet_id:
    type: string
    title: "endpoint subnet id"
    description: "Private subnet OCID for the API endpoint."
    required: true
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  cluster_id:
    type: ocid
    title: "OCID of the OKE cluster."
