title: "credentials stack"
description: "Creates credentials with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
  - title: "Parameters"
    variables:
      - user_id
      - project
      - environment
variables:
  user_id:
    type: string
    title: "user id"
    description: "The OCID of the user to manage credentials for."
    required: true
  project:
    type: string
    title: "project"
    description: "Project name used for tagging and naming."
    required: false
    default: "oci-modules"
  environment:
    type: string
    title: "environment"
    description: "Environment name."
    required: false
    default: "development"
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  auth_token_ids:
    type: csv
    title: "Map of auth token identifiers."
  auth_token_values:
    type: string
    title: "Map of auth token values (sensitive)."
  reminders:
    type: string
    title: "Helpful reminders and next steps."
