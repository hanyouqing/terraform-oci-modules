title: "notifications stack"
description: "Creates notifications with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
  - title: "Parameters"
    variables:
      - email_endpoint
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "OCID of the compartment"
    required: true
  email_endpoint:
    type: string
    title: "email endpoint"
    description: "Email address for notifications"
    required: true
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  topic_ids:
    type: csv
    title: "Topic IDs"
  subscription_ids:
    type: csv
    title: "Subscription IDs"
