title: "vcn stack"
description: "Creates vcn with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - tenancy_ocid
      - compartment_ocid
  - title: "Parameters"
    variables:
      - ssh_allow_cidrs
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "OCID of the compartment"
    required: true
  tenancy_ocid:
    type: string
    title: "tenancy ocid"
    description: "OCID of the tenancy"
    required: true
  ssh_allow_cidrs:
    type: array
    title: "ssh allow cidrs"
    description: "Optional CIDRs allowed for SSH (empty = no SSH ingress)"
    required: false
    default: []
    items:
      type: string
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  vcn_id:
    type: ocid
    title: "VCN ID"
  public_subnet_ids:
    type: csv
    title: "Public subnet IDs"
  internet_gateway_id:
    type: ocid
    title: "Internet Gateway ID"
