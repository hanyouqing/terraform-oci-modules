title: "email delivery stack"
description: "Creates email-delivery with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
  - title: "Parameters"
    variables:
      - sender_email
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "OCID of the compartment"
    required: true
  sender_email:
    type: string
    title: "sender email"
    description: "Email address for the sender"
    required: true
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  sender_ids:
    type: csv
    title: "Sender IDs"
