title: "waf stack"
description: "Creates waf with the basic example defaults. Upload this directory as an OCI Resource Manager stack on Terraform 1.5.x."
schemaVersion: 1.1.0
version: "1.0.0"
locale: en
variableGroups:
  - title: "Identity"
    variables:
      - region
      - compartment_ocid
  - title: "Parameters"
    variables:
      - display_name
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "compartment ocid"
    description: "Compartment OCID for the WAF policy."
    required: true
  display_name:
    type: string
    title: "display name"
    description: "Display name of the WAF policy."
    required: false
    default: "waf-basic"
  region:
    type: oci:identity:region:name
    title: "region"
    description: "OCI region. Resource Manager fills this when the stack is created."
    required: true
outputs:
  policy_id:
    type: ocid
    title: "OCID of the WAF policy."
